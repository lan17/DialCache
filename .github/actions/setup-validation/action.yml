name: Set up validation
description: Install the shared pinned Node/pnpm environment and optional Go/Quint tools.
inputs:
  go:
    description: Install the pinned Go toolchain.
    default: "false"
  quint:
    description: Install the pinned Quint CLI and Rust evaluator.
    default: "false"
  java:
    description: Install Java 21 for bounded symbolic model checking.
    default: "false"
  rust:
    description: Install the pinned Rust toolchain (rust/rust-toolchain.toml) with clippy and rustfmt.
    default: "false"
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      with:
        version: 10.33.0
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version: "24"
        cache: pnpm
    - name: Install project dependencies
      shell: bash
      run: corepack pnpm install --frozen-lockfile
    - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
      if: inputs.go == 'true'
      with:
        go-version: "1.27.1"
        cache-dependency-path: go/go.sum
    - uses: ./.github/actions/setup-quint
      if: inputs.quint == 'true'
    - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
      if: inputs.java == 'true'
      with:
        distribution: temurin
        java-version: "21"
    # The toolchain pin matches rust/rust-toolchain.toml and the cargo 1.98.1
    # prerequisite probe in formal/validation.mjs.
    - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-09-12
      if: inputs.rust == 'true'
      with:
        toolchain: 1.98.1
        components: clippy, rustfmt
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      if: inputs.rust == 'true'
      with:
        workspaces: rust
