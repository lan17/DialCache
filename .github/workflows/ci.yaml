name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    runs-on: ubuntu-latest
    services:
      docs-redis:
        image: redis:6.2
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 1s --health-timeout 3s --health-retries 20
    env:
      DOCS_REDIS_URL: redis://127.0.0.1:6379
    # id-token lets the Codecov upload authenticate via OIDC instead of a
    # long-lived token secret.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ./.github/actions/setup-validation
      - name: Check release version and publication guards
        run: python3 -B -m unittest discover -s scripts -p test_release.py
      - name: Check TypeScript types, native tests, build and package
        run: make check-ts
      # push events only reach this workflow for main, so this uploads
      # coverage exactly when a commit lands there — never for PRs.
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        if: github.event_name == 'push'
        with:
          files: ./typescript/coverage/lcov.info
          disable_search: true
          use_oidc: true
          fail_ci_if_error: true
      - name: Check real Redis, Valkey and Cluster integrations
        run: make integration-ts
      # Prove the exact consumer floor (first 22.x with node:zlib zstd);
      # development and integration stay on Node 24.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22.15.0"
          cache: "pnpm"
      - name: Test packed package on the minimum Node.js version
        run: make package-floor

  go:
    runs-on: ubuntu-latest
    services:
      docs-redis:
        image: redis:6.2
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 1s --health-timeout 3s --health-retries 20
    env:
      DOCS_REDIS_URL: redis://127.0.0.1:6379
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ./.github/actions/setup-validation
        with:
          go: "true"
      - name: Check Go formatting, vet and native tests with race detection
        run: make check-go
      - name: Check real Redis, Valkey, Cluster and TypeScript interoperability with race detection
        run: make integration-go
      - name: Retain Go integration results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: go-integration-results
          path: .formal-traces/go-integration.jsonl
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn

  rust:
    runs-on: ubuntu-latest
    services:
      docs-redis:
        image: redis:6.2
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 1s --health-timeout 3s --health-retries 20
    env:
      DOCS_REDIS_URL: redis://127.0.0.1:6379
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ./.github/actions/setup-validation
        with:
          rust: "true"
      - name: Check Rust formatting, clippy and native tests including the smoke conformance run
        run: make check-rust
      - name: Verify the packaged Rust crate with every feature
        working-directory: rust
        run: cargo package --locked --all-features
      - name: Execute the documented Rust invalidation scenario against Redis
        run: cargo test --manifest-path rust/Cargo.toml --locked --all-features --test docs_examples -- --ignored
      - name: Check real Redis, Valkey and Cluster integrations and invalidation vectors
        run: make integration-rust

  # The existing required `test` status now requires every native language job.
  test:
    needs: [typescript, go, rust]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful TypeScript, Go and Rust checks
        env:
          TYPESCRIPT_RESULT: ${{ needs.typescript.result }}
          GO_RESULT: ${{ needs.go.result }}
          RUST_RESULT: ${{ needs.rust.result }}
        run: |
          test "$TYPESCRIPT_RESULT" = success
          test "$GO_RESULT" = success
          test "$RUST_RESULT" = success
