name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    runs-on: ubuntu-latest
    services:
      docs-redis:
        image: redis:6.2
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 1s --health-timeout 3s --health-retries 20
    env:
      DOCS_REDIS_URL: redis://127.0.0.1:6379
    # id-token lets the Codecov upload authenticate via OIDC instead of a
    # long-lived token secret.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ./.github/actions/setup-validation
      - name: Check release version and publication guards
        run: python3 -B -m unittest discover -s scripts -p 'test_*release.py'
      - name: Check TypeScript types, native tests, build and package
        run: make check-ts
      # Upload all three languages on PRs and main so Codecov can compare complete
      # reports and expose each language separately through flags.
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./typescript/coverage/lcov.info
          flags: typescript
          name: typescript
          disable_search: true
          use_oidc: true
          fail_ci_if_error: true
      - name: Check real Redis, Valkey and Cluster integrations
        run: make integration-ts
      # Prove the exact consumer floor (first 22.x with node:zlib zstd);
      # development and integration stay on Node 24.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22.15.0"
          cache: "pnpm"
      - name: Test packed package on the minimum Node.js version
        run: make package-floor

  go:
    runs-on: ubuntu-latest
    services:
      docs-redis:
        image: redis:6.2
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 1s --health-timeout 3s --health-retries 20
    env:
      DOCS_REDIS_URL: redis://127.0.0.1:6379
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ./.github/actions/setup-validation
        with:
          go: "true"
      - name: Check Go formatting, vet and native tests with race detection and coverage
        run: make check-go
      - name: Check real Redis, Valkey, Cluster and TypeScript interoperability with race detection
        run: make integration-go
      # Match TypeScript and Rust so PR reports include every measured language.
      - name: Upload Go coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./go/coverage-unit.out,./go/coverage-integration.out
          flags: go
          name: go
          disable_search: true
          use_oidc: true
          fail_ci_if_error: true
      - name: Retain Go integration results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: go-integration-results
          path: .formal-traces/go-integration.jsonl
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn

  rust:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    services:
      docs-redis:
        image: redis:6.2
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 1s --health-timeout 3s --health-retries 20
    env:
      DOCS_REDIS_URL: redis://127.0.0.1:6379
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ./.github/actions/setup-validation
        with:
          rust: "true"
      - name: Verify the packaged Rust crate with every feature
        working-directory: rust
        run: cargo package --locked --all-features
      - name: Install LLVM coverage tools for the pinned Rust toolchain
        working-directory: rust
        run: rustup component add llvm-tools-preview
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: cargo-llvm-cov@0.9.1
          fallback: none
      - name: Check Rust and measure native, conformance and real-server coverage
        working-directory: rust
        run: |
          # Instrument the existing Make targets, retaining all native checks
          # and doctest execution. Keep profiles from every test invocation.
          coverage_env="$(cargo llvm-cov show-env --sh)"
          eval "$coverage_env"
          cargo llvm-cov clean --workspace
          make -C .. check-rust
          cargo test --locked --all-features --test docs_examples -- --ignored
          make -C .. integration-rust
          # Exclude standalone tests, toolchain sources and the test-util runtime.
          # Inline unit-test modules retain LLVM's normal coverage semantics.
          mkdir -p ../coverage/rust
          cargo llvm-cov report --lcov --output-path ../coverage/rust/lcov.info \
            --ignore-filename-regex '/(tests|examples|rustlib)/|/src/(testing|cpu_tests|read_snapshot_tests)\.rs$'
      - name: Retain the Rust coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rust-coverage
          path: coverage/rust/lcov.info
          retention-days: 14
          if-no-files-found: error
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage/rust/lcov.info
          flags: rust
          name: rust
          disable_search: true
          use_oidc: true
          fail_ci_if_error: true

  python:
    uses: ./.github/workflows/python.yml
    permissions:
      contents: read
      id-token: write

  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ./.github/actions/setup-validation
        with:
          python: "true"
          go: "true"
          rust: "true"
      - name: Check every language pair over real Redis, Valkey and Cluster
        run: make integration-wire
      - name: Retain cross-language wire results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wire-integration-results
          path: .formal-traces/wire-integration-*.xml
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  # Keep every native language behind the branch's required `test` status.
  test:
    needs: [typescript, go, rust, python, wire]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful native and cross-language wire checks
        env:
          TYPESCRIPT_RESULT: ${{ needs.typescript.result }}
          GO_RESULT: ${{ needs.go.result }}
          RUST_RESULT: ${{ needs.rust.result }}
          PYTHON_RESULT: ${{ needs.python.result }}
          WIRE_RESULT: ${{ needs.wire.result }}
        run: |
          test "$TYPESCRIPT_RESULT" = success
          test "$GO_RESULT" = success
          test "$RUST_RESULT" = success
          test "$PYTHON_RESULT" = success
          test "$WIRE_RESULT" = success
