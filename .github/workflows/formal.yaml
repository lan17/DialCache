name: Formal specification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: formal-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.33.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27.1"
          cache: false
      - name: Install Quint
        run: npm install --global @informalsystems/quint@0.32.0
      - name: Check executable specifications
        run: bash formal/check.sh
      - name: Generate model-based conformance traces
        run: bash formal/generate-traces.sh
      - name: Replay generated traces against TypeScript
        env:
          DIALCACHE_MBT_TRACE_DIR: .formal-traces/conformance
          DIALCACHE_EFFECTS_TRACE_DIR: .formal-traces/effects
          DIALCACHE_FEATURE_TRACE_DIR: .formal-traces/features
        run: pnpm exec vitest run test/formal-conformance.test.ts test/formal-effects.test.ts test/formal-features.test.ts test/formal-behavior.test.ts test/formal-protocol-vectors.test.ts --coverage.enabled=false
      - name: Replay core and protocol vectors against the Go reference
        shell: bash
        env:
          DIALCACHE_MBT_TRACE_DIR: ${{ github.workspace }}/.formal-traces/conformance
        run: go -C formal/go test -race -count=1 -v ./... | tee .formal-traces/go-reference.log
      - name: Measure semantic cases and retain behavioral fault detection
        run: node formal/measure-semantics.mjs
      - name: Preserve formal traces and counterexamples
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: formal-traces
          path: .formal-traces/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
