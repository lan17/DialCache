name: Formal specification

on:
  push:
    branches: [main]
    paths:
      - "formal/**"
      - "test/formal-protocol-vectors.test.ts"
      - "test/formal-conformance.test.ts"
      - ".github/workflows/formal.yaml"
  pull_request:
    paths:
      - "formal/**"
      - "test/formal-protocol-vectors.test.ts"
      - "test/formal-conformance.test.ts"
      - ".github/workflows/formal.yaml"

permissions:
  contents: read

concurrency:
  group: formal-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.33.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Install Quint
        run: npm install --global @informalsystems/quint@0.32.0
      - name: Check executable specifications
        run: bash formal/check.sh
      - name: Generate model-based conformance traces
        run: |
          rm -rf .formal-traces
          mkdir -p .formal-traces
          quint run formal/dialcache-conformance.qnt \
            --mbt \
            --backend=rust \
            --seed=0xd1a1ca \
            --max-samples=256 \
            --max-steps=30 \
            --n-traces=32 \
            --out-itf='.formal-traces/trace_{seq}.itf.json'
      - name: Replay generated traces against TypeScript
        env:
          DIALCACHE_MBT_TRACE_DIR: .formal-traces
        run: pnpm exec vitest run test/formal-conformance.test.ts --coverage.enabled=false
