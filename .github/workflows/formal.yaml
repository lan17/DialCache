name: Formal specification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: formal-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.33.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Install Quint
        run: npm install --global @informalsystems/quint@0.32.0
      - name: Install pinned Quint Rust evaluator
        shell: bash
        # Quint 0.32.0 downloads anonymously through the GitHub API on a cache miss.
        # Seed its cache from the fixed release asset to avoid shared-runner rate limits.
        run: |
          quint_archive="$RUNNER_TEMP/quint-evaluator.tar.gz"
          curl --fail --location --retry 3 --output "$quint_archive" https://github.com/quint-co/quint/releases/download/evaluator/v0.6.0/quint_evaluator-x86_64-unknown-linux-gnu.tar.gz
          printf '%s  %s\n' '61755a09d5052d93a4e75e840059edfd0d3674aeda164b9d2464be3d6e21b1c2' "$quint_archive" | sha256sum --check
          quint_directory="$HOME/.quint/rust-evaluator-v0.6.0"
          mkdir -p "$quint_directory"
          tar -xzf "$quint_archive" -C "$quint_directory"
          chmod +x "$quint_directory/quint_evaluator"
      - name: Check executable specifications
        run: bash formal/check.sh
      - name: Generate model-based conformance traces
        run: bash formal/generate-traces.sh
      - name: Recompute committed Quint smoke and witness fixtures
        run: node formal/generated-fixtures.mjs --check
      - name: Bind TypeScript replay to its exact inputs
        run: node formal/conformance.mjs prepare typescript .formal-traces/ts-context.json
      - name: Replay generated traces against TypeScript
        env:
          DIALCACHE_MBT_TRACE_DIR: .formal-traces/conformance
          DIALCACHE_EFFECTS_TRACE_DIR: .formal-traces/effects
          DIALCACHE_FEATURE_TRACE_DIR: .formal-traces/features
          DIALCACHE_COVERAGE_EVIDENCE_DIR: .formal-traces/go-parity-witnesses
        run: pnpm exec vitest run test/formal-conformance.test.ts test/formal-effects.test.ts test/formal-features.test.ts test/formal-local-clock.test.ts test/formal-behavior.test.ts test/formal-protocol-vectors.test.ts --coverage.enabled=false --reporter=default --reporter=json --outputFile=.formal-traces/ts-replay.json
      - name: Require complete TypeScript replay through the shared contract
        run: |
          node formal/conformance-adapters.mjs typescript .formal-traces/ts-replay.json .formal-traces/ts-context.json > .formal-traces/ts-completion.json
          node formal/conformance.mjs check .formal-traces/ts-completion.json .formal-traces/ts-context.json
      - name: Preserve formal traces and counterexamples
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: formal-traces
          path: .formal-traces/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  typescript-mutations:
    needs: corpus
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.33.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: formal-traces
          path: .formal-traces
      - name: Measure semantic cases and retain behavioral fault detection
        run: node formal/measure-semantics.mjs
      - name: Preserve TypeScript mutation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: typescript-semantic-evidence
          path: .formal-traces/semantic/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  go-parity:
    needs: corpus
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.33.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27.1"
          cache-dependency-path: go/go.sum
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: formal-traces
          path: .formal-traces
      - name: Validate Go bindings and parity inventory
        run: |
          node formal/check-go-parity.mjs
          go -C go vet ./...
          test -z "$(gofmt -l go)"
      - name: Check Redis, Valkey, Cluster and TypeScript interoperability
        shell: bash
        run: go -C go test -race -tags integration -count=1 -run '^TestRedisIntegration$' -json ./... | tee .formal-traces/go-integration.jsonl
      - name: Bind Go replay to its exact inputs
        run: node formal/conformance.mjs prepare go .formal-traces/go-context.json
      - name: Replay the same generated corpus against Go with race detection
        shell: bash
        env:
          DIALCACHE_MBT_TRACE_DIR: ${{ github.workspace }}/.formal-traces/conformance
          DIALCACHE_EFFECTS_TRACE_DIR: ${{ github.workspace }}/.formal-traces/effects
          DIALCACHE_FEATURE_TRACE_DIR: ${{ github.workspace }}/.formal-traces/features
          DIALCACHE_WITNESS_EVIDENCE_DIR: ${{ github.workspace }}/.formal-traces/go-parity-witnesses
        run: |
          go -C go test -count=1 -run '^TestGeneratedWitnessEvidence$' ./...
          go -C go test -race -count=1 -json ./... | tee .formal-traces/go-replay.jsonl
      - name: Require complete generated, fixed, protocol and witness replay
        run: |
          node formal/check-go-replay.mjs > .formal-traces/go-replay-summary.json
          node formal/conformance-adapters.mjs go .formal-traces/go-replay.jsonl .formal-traces/go-context.json > .formal-traces/go-completion.json
          node formal/conformance.mjs check .formal-traces/go-completion.json .formal-traces/go-context.json
      - name: Require assertion-based Go fault detection
        run: node formal/measure-go-semantics.mjs
      - name: Preserve Go parity evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: go-parity-evidence
          path: |
            .formal-traces/go-replay.jsonl
            .formal-traces/go-replay-summary.json
            .formal-traces/go-context.json
            .formal-traces/go-completion.json
            .formal-traces/go-integration.jsonl
            .formal-traces/go-semantic/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  # Preserve the existing required check name and require every parity stage.
  # Run after failures too: skipped dependencies must not make this gate green.
  quint:
    needs: [corpus, typescript-mutations, go-parity]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require complete formal and cross-language validation
        if: always()
        env:
          CORPUS_RESULT: ${{ needs.corpus.result }}
          TYPESCRIPT_RESULT: ${{ needs.typescript-mutations.result }}
          GO_RESULT: ${{ needs.go-parity.result }}
        run: |
          test "$CORPUS_RESULT" = success
          test "$TYPESCRIPT_RESULT" = success
          test "$GO_RESULT" = success
