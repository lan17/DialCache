name: Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - typescript/package.json

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The preparation run can create a branch and PR, but it cannot publish to
    # registries, tag a release, approve the PR, merge it, or bypass branch protection.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.33.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-09-12
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
      - name: Verify release source
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Release workflow must be run from main; got $GITHUB_REF" >&2
            exit 1
          fi

          git fetch --force origin main:refs/remotes/origin/main --tags
          remote_main="$(git rev-parse origin/main)"
          if [[ "$GITHUB_SHA" != "$remote_main" ]]; then
            echo "Release source $GITHUB_SHA is not current origin/main $remote_main" >&2
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Resolve release
        id: release
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        with:
          semantic_version: 25.0.7
          extra_plugins: conventional-changelog-conventionalcommits@9.3.1
          dry_run: true
        env:
          # Planning excludes the npm and GitHub publishing plugins, so this
          # job does not need an npm OIDC identity or release permissions.
          DIALCACHE_RELEASE_PLAN_ONLY: "true"
          GITHUB_TOKEN: ${{ github.token }}
      - name: Record no-op release
        if: steps.release.outputs.new_release_version == ''
        run: echo "No releasable commits were found." >> "$GITHUB_STEP_SUMMARY"
      - name: Open version pull request
        if: steps.release.outputs.new_release_version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release.outputs.new_release_version }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release version: $RELEASE_VERSION" >&2
            exit 1
          fi

          release_branch="release/v$RELEASE_VERSION"
          release_title="release: $RELEASE_VERSION"
          existing_pr="$(
            gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$release_branch" \
              --state open \
              --json url \
              --jq '.[0].url // empty'
          )"
          remote_ref="$(git ls-remote --heads origin "refs/heads/$release_branch")"

          if [[ -n "$remote_ref" ]]; then
            git fetch --force origin \
              "refs/heads/$release_branch:refs/remotes/origin/$release_branch"
            release_commit="$(git rev-parse "refs/remotes/origin/$release_branch")"
            release_parent="$(git rev-parse "${release_commit}^")"
            release_subject="$(git log -1 --format=%s "$release_commit")"
            if [[ "$release_parent" != "$GITHUB_SHA" ]]; then
              echo "Existing $release_branch is not based on current main $GITHUB_SHA" >&2
              exit 1
            fi
            if [[ "$release_subject" != "$release_title" ]]; then
              echo "Expected $release_branch subject '$release_title'; got '$release_subject'" >&2
              exit 1
            fi
            python3 scripts/release.py verify "$RELEASE_VERSION" "$GITHUB_SHA" "$release_commit"
            git checkout --detach "$release_commit"
          else
            if [[ -n "$existing_pr" ]]; then
              echo "Open release PR $existing_pr has no remote head branch" >&2
              exit 1
            fi

            python3 scripts/release.py update "$RELEASE_VERSION"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- typescript/package.json rust/Cargo.toml rust/Cargo.lock
            git commit -m "$release_title"
            python3 scripts/release.py verify "$RELEASE_VERSION" "$GITHUB_SHA" HEAD
          fi

          # Check the committed candidate, including when reusing a release PR.
          # Cargo verifies an extracted archive, catching missing package files.
          (cd rust && cargo package --locked --all-features)
          if [[ -z "$remote_ref" ]]; then
            git -c credential.helper= \
              -c "credential.helper=!f() { echo username=x-access-token; echo \"password=\$GH_TOKEN\"; }; f" \
              push "https://github.com/$GITHUB_REPOSITORY.git" \
              "HEAD:refs/heads/$release_branch"
          fi

          if [[ -n "$existing_pr" ]]; then
            existing_title="$(gh pr view "$existing_pr" --json title --jq .title)"
            if [[ "$existing_title" != "$release_title" ]]; then
              echo "Expected PR title '$release_title'; got '$existing_title'" >&2
              exit 1
            fi
            echo "Release PR already open: $existing_pr" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          pr_body="Automated by the Release workflow run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID.

          This PR updates typescript/package.json, rust/Cargo.toml and rust/Cargo.lock to $RELEASE_VERSION. Approve its workflow runs, review it, and squash-merge it to publish npm, Go and Rust from the same protected main commit."
          pr_url="$(
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$release_branch" \
              --title "$release_title" \
              --body "$pr_body"
          )"
          echo "Opened release PR: $pr_url" >> "$GITHUB_STEP_SUMMARY"

  publish:
    if: "${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release: ') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      release_commit: ${{ steps.source.outputs.release_commit }}
      release_version: ${{ steps.source.outputs.release_version }}
    # contents: write pushes the release tag and GitHub release;
    # id-token: write mints the OIDC token for npm trusted publishing.
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.33.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-09-12
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
      - name: Verify publish source
        id: source
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Release publish must run from main; got $GITHUB_REF" >&2
            exit 1
          fi

          git fetch --force origin main:refs/remotes/origin/main --tags
          remote_main="$(git rev-parse origin/main)"
          if [[ "$GITHUB_SHA" != "$remote_main" ]]; then
            echo "Release source $GITHUB_SHA is not current main $remote_main" >&2
            exit 1
          fi

          release_subject="$(git log -1 --format=%s "$GITHUB_SHA")"
          if [[ ! "$release_subject" =~ ^release:\ ([0-9]+\.[0-9]+\.[0-9]+)(\ \(#[0-9]+\))?$ ]]; then
            echo "Invalid release commit subject: $release_subject" >&2
            exit 1
          fi
          release_version="${BASH_REMATCH[1]}"

          parent_count="$(git rev-list --parents -n 1 "$GITHUB_SHA" | awk '{print NF - 1}')"
          if [[ "$parent_count" != "1" ]]; then
            echo "Release commit must have exactly one parent; got $parent_count" >&2
            exit 1
          fi
          release_parent="$(git rev-parse "${GITHUB_SHA}^")"
          python3 scripts/release.py verify "$release_version" "$release_parent" "$GITHUB_SHA"
          if git rev-parse --verify --quiet "refs/tags/v$release_version" >/dev/null; then
            echo "Release tag v$release_version already exists" >&2
            exit 1
          fi

          # The Go module in go/ is released on the same commit as go/v<version>.
          # A module in a subdirectory takes that directory as its tag prefix,
          # and from major 2 its path must carry the major as a suffix.
          go_module="$(awk '$1 == "module" { print $2; exit }' go/go.mod)"
          go_major="${release_version%%.*}"
          expected_go_module="github.com/$GITHUB_REPOSITORY/go"
          if (( go_major >= 2 )); then
            expected_go_module="$expected_go_module/v$go_major"
          fi
          if [[ "$go_module" != "$expected_go_module" ]]; then
            echo "Expected go/go.mod to declare module $expected_go_module for release $release_version; got $go_module" >&2
            exit 1
          fi
          if git rev-parse --verify --quiet "refs/tags/go/v$release_version" >/dev/null; then
            echo "Go module tag go/v$release_version already exists" >&2
            exit 1
          fi

          echo "release_commit=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "release_version=$release_version" >> "$GITHUB_OUTPUT"
          echo "go_module=$go_module" >> "$GITHUB_OUTPUT"
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Verify the Rust release package before publishing
        working-directory: rust
        run: cargo package --locked --all-features
      - name: Resolve publish release
        id: plan
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        with:
          semantic_version: 25.0.7
          extra_plugins: conventional-changelog-conventionalcommits@9.3.1
          dry_run: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Verify publish plan
        env:
          PLANNED_RELEASE_COMMIT: ${{ steps.plan.outputs.new_release_git_head }}
          PLANNED_RELEASE_VERSION: ${{ steps.plan.outputs.new_release_version }}
          EXPECTED_RELEASE_COMMIT: ${{ steps.source.outputs.release_commit }}
          EXPECTED_RELEASE_VERSION: ${{ steps.source.outputs.release_version }}
        run: |
          if [[ "$PLANNED_RELEASE_COMMIT" != "$EXPECTED_RELEASE_COMMIT" ]]; then
            echo "Expected planned release commit $EXPECTED_RELEASE_COMMIT; got $PLANNED_RELEASE_COMMIT" >&2
            exit 1
          fi
          if [[ "$PLANNED_RELEASE_VERSION" != "$EXPECTED_RELEASE_VERSION" ]]; then
            echo "Expected planned release version $EXPECTED_RELEASE_VERSION; got $PLANNED_RELEASE_VERSION" >&2
            exit 1
          fi
      - name: Semantic Release
        id: release
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        with:
          semantic_version: 25.0.7
          extra_plugins: conventional-changelog-conventionalcommits@9.3.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Verify published release
        env:
          ACTUAL_RELEASE_COMMIT: ${{ steps.release.outputs.new_release_git_head }}
          ACTUAL_RELEASE_VERSION: ${{ steps.release.outputs.new_release_version }}
          EXPECTED_RELEASE_COMMIT: ${{ steps.source.outputs.release_commit }}
          EXPECTED_RELEASE_VERSION: ${{ steps.source.outputs.release_version }}
        run: |
          if [[ "$ACTUAL_RELEASE_COMMIT" != "$EXPECTED_RELEASE_COMMIT" ]]; then
            echo "Expected release commit $EXPECTED_RELEASE_COMMIT; got $ACTUAL_RELEASE_COMMIT" >&2
            exit 1
          fi
          if [[ "$ACTUAL_RELEASE_VERSION" != "$EXPECTED_RELEASE_VERSION" ]]; then
            echo "Expected release version $EXPECTED_RELEASE_VERSION; got $ACTUAL_RELEASE_VERSION" >&2
            exit 1
          fi
      - name: Tag the Go module
        env:
          GH_TOKEN: ${{ github.token }}
          GO_MODULE: ${{ steps.source.outputs.go_module }}
          RELEASE_COMMIT: ${{ steps.source.outputs.release_commit }}
          RELEASE_VERSION: ${{ steps.source.outputs.release_version }}
        run: |
          # Go has no package registry: a module version is a Git tag. The
          # module path and the absent tag were verified before any release
          # side effect, so this step only creates and publishes the tag.
          tag="go/v$RELEASE_VERSION"
          existing="$(git rev-parse --verify --quiet "refs/tags/$tag^{commit}" || true)"
          if [[ -n "$existing" && "$existing" != "$RELEASE_COMMIT" ]]; then
            echo "Go module tag $tag already exists at $existing, not at $RELEASE_COMMIT" >&2
            exit 1
          fi
          if [[ -z "$existing" ]]; then
            git tag "$tag" "$RELEASE_COMMIT"
            git -c credential.helper= \
              -c "credential.helper=!f() { echo username=x-access-token; echo \"password=\$GH_TOKEN\"; }; f" \
              push "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/$tag"
          fi
          echo "Tagged Go module $GO_MODULE as $tag" >> "$GITHUB_STEP_SUMMARY"

          # Ask the public module proxy and the checksum database for the
          # version now, so they record it before the first consumer asks and
          # pkg.go.dev picks it up from the proxy index. Best effort: the tag
          # is the release, and both services fetch on demand. Uppercase path
          # letters are escaped as ! followed by the lowercase letter.
          escaped=""
          for (( i = 0; i < ${#GO_MODULE}; i++ )); do
            ch="${GO_MODULE:i:1}"
            if [[ "$ch" == [[:upper:]] ]]; then
              escaped+="!$(printf '%s' "$ch" | tr '[:upper:]' '[:lower:]')"
            else
              escaped+="$ch"
            fi
          done
          warm() {
            if curl -sSf --retry 5 --retry-all-errors --retry-delay 15 "$2" >/dev/null; then
              echo "$1 recorded $GO_MODULE@v$RELEASE_VERSION" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::$1 has not recorded $GO_MODULE@v$RELEASE_VERSION yet; the first go get will."
            fi
          }
          warm proxy.golang.org "https://proxy.golang.org/$escaped/@v/v$RELEASE_VERSION.info"
          warm sum.golang.org "https://sum.golang.org/lookup/$escaped@v$RELEASE_VERSION"

  publish-rust:
    # A separate job can be retried after a crates.io failure without repeating
    # npm publication or Go tagging. Always use the captured release, even if
    # main has advanced before the retry.
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_COMMIT: ${{ needs.publish.outputs.release_commit }}
      RELEASE_VERSION: ${{ needs.publish.outputs.release_version }}
      HAS_BOOTSTRAP_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.publish.outputs.release_commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-09-12
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
      - name: Verify the published release identity
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          test "$(git rev-parse "v$RELEASE_VERSION^{commit}")" = "$RELEASE_COMMIT"
          test "$(git rev-parse "go/v$RELEASE_VERSION^{commit}")" = "$RELEASE_COMMIT"
          python3 scripts/release.py verify "$RELEASE_VERSION" "$RELEASE_COMMIT^" "$RELEASE_COMMIT"
      - name: Package and check for an identical existing publication
        id: package
        working-directory: rust
        run: |
          cargo package --locked --all-features
          python3 ../scripts/release.py published "$RELEASE_VERSION" \
            "target/package/dialcache-$RELEASE_VERSION.crate" >> "$GITHUB_OUTPUT"
      - name: Authenticate to crates.io with GitHub
        id: crates-auth
        if: steps.package.outputs.published != 'true' && env.HAS_BOOTSTRAP_TOKEN != 'true'
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish the Rust crate
        if: steps.package.outputs.published != 'true'
        working-directory: rust
        env:
          # The first publication requires an API token. Remove this secret
          # after configuring trusted publishing to use short-lived OIDC tokens.
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || steps.crates-auth.outputs.token }}
        run: cargo publish --locked --all-features
      - name: Record Rust release
        run: echo "Rust dialcache@$RELEASE_VERSION published from $RELEASE_COMMIT to https://crates.io/crates/dialcache/$RELEASE_VERSION" >> "$GITHUB_STEP_SUMMARY"
