[package]
name = "dialcache-production-consumer"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
dialcache = { path = "../.." }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
