[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "dialcache"
version = "0.25.0"
description = "Explicitly enabled async caching with runtime policies, coalescing, and tracked Redis invalidation."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Lev Neiman" }]
dependencies = ["zstandard>=0.23,<1"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Framework :: AsyncIO",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
redis = ["redis>=5,<7"]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "jsonschema>=4.23,<5", "coverage>=7.11,<8"]

[project.urls]
Repository = "https://github.com/lan17/DialCache"
Documentation = "https://github.com/lan17/DialCache/tree/main/python"

[tool.hatch.build.targets.wheel]
packages = ["dialcache"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
  "integration: requires a real Redis or Valkey server, with optional cluster or mixed-language coverage",
]

[tool.coverage.run]
branch = true
relative_files = true
source = ["python/dialcache"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
